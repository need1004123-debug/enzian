<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩹 엔치안의 비밀 방 ‧˚₊*̥</title>
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Moirai+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --menhera-pink: #ffb5a7;
            --menhera-blue: #b5ead7;
            --menhera-dark: #2b2d42;
            --menhera-sub: #ff99c8;
            --bg-color: #f7f3f5;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', 'Jua', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #cbf3f0 100%);
            color: var(--menhera-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 153, 200, 0.25);
            border: 3px dashed var(--menhera-sub);
            position: relative;
        }

        .container::before {
            content: "🔪 ⑅ 🩹 ⑅ 💊";
            display: block;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        h1 {
            font-family: 'Jua', sans-serif;
            color: #ff6b81;
            font-size: 2.3rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #a0c4ff;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8d99ae;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .section-box {
            background: #fff9fb;
            border: 2px solid #ffccd5;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-box h2 {
            font-family: 'Jua', sans-serif;
            font-size: 1.3rem;
            color: #ff758f;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #6c757d;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2ece9;
            border-radius: 12px;
            font-family: inherit;
            background: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--menhera-sub);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="file"] {
            font-size: 0.9rem;
            color: #666;
        }

        #preview-container {
            margin-top: 10px;
            text-align: center;
        }

        #image-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            display: none;
            border: 2px solid #ffccd5;
            margin: 0 auto;
        }

        .btn {
            background: linear-gradient(135deg, #ff99c8, #a0c4ff);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-family: 'Jua', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 153, 200, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(160, 196, 255, 0.6);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }

        .gallery-item {
            background: #ffffff;
            border: 2px dashed #a0c4ff;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-3px);
            border-color: #ff99c8;
        }

        .gallery-item .author {
            font-family: 'Jua', sans-serif;
            color: #ff6b81;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .gallery-item .content {
            font-size: 0.9rem;
            color: #495057;
            white-space: pre-wrap;
            margin-bottom: 12px;
            line-height: 1.4;
            word-break: break-all;
        }

        .gallery-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #f1f1f1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px dashed #f0f0f0;
            padding-top: 8px;
        }

        .gallery-item .date {
            font-size: 0.7rem;
            color: #adb5bd;
        }

        .delete-btn {
            background-color: #ffe5ec;
            color: #ff6b81;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-family: 'Jua', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #ffb5a7;
            color: white;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #8d99ae;
        }

        /* ✨ 마우스 커서 반짝이 효과 */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            user-select: none;
            font-size: 15px;
            animation: fadeSparkle 0.85s ease-out forwards;
            z-index: 99999;
        }

        @keyframes fadeSparkle {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(180deg);
                opacity: 0;
            }
        }

        /* 🩸 버튼 클릭 시 핏방울 효과 */
        .blood-particle {
            position: fixed;
            background: #d90429;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100000;
            box-shadow: 0 0 6px rgba(217, 4, 41, 0.85);
            animation: splatBlood 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes splatBlood {
            0% {
                transform: translate(0, 0) scale(1.4);
                opacity: 1;
            }
            70% {
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--bx), var(--by)) scale(0.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🩹 엔치안의 일기장 💊</h1>
        <div class="subtitle">"Something kinda sad about <br> The way that things have come to be, Desensitized to everything"</div>

        <!-- 글 & 그림 올리기 섹션 -->
        <div class="section-box">
            <h2>🎀 그림 & 글 기록하기</h2>
            <div class="form-group">
                <label for="author">이름 (닉네임)</label>
                <input type="text" id="author" placeholder="너의 이름을 알려줘...">
            </div>
            <div class="form-group">
                <label for="content">하고 싶은 말 / 일기</label>
                <textarea id="content" placeholder="오늘 있던 슬픈 일, 혹은 기쁜 일을 적어줘..."></textarea>
            </div>
            <div class="form-group">
                <label for="imageFile">그림 업로드 (이미지)</label>
                <input type="file" id="imageFile" accept="image/*" onchange="compressAndPreview(event)">
                <div id="preview-container">
                    <img id="image-preview" src="" alt="미리보기">
                </div>
            </div>
            <!-- 클릭 시 피 튀김 함수 함께 실행 -->
            <button class="btn" onclick="triggerBloodSplat(event); addPost();">비밀 공간에 남기기 💉</button>
        </div>

        <!-- 방명록 갤러리 섹션 -->
        <div class="section-box">
            <h2>🖼️ 방문자들의 노트</h2>
            <div id="guestbookList" class="gallery-grid">
                <!-- 방명록 아이템들이 여기에 갤러리 형태로 쌓입니다 -->
            </div>
        </div>

        <footer>
            &copy; Enzian. All rights reserved. 🖤
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCPPsr9m_QqxP974ZeeKn4Rdb_7cRIcTgk",
            authDomain: "enzianindex.firebaseapp.com",
            databaseURL: "https://enzianindex-default-rtdb.firebaseio.com",
            projectId: "enzianindex",
            storageBucket: "enzianindex.firebasestorage.app",
            messagingSenderId: "477215208110",
            appId: "1:477215208110:web:c590b267408b6fa5ca333f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const postsRef = database.ref('guestbook');

        let compressedImageBase64 = "";

        // ✨ 마우스 반짝이 이펙트 로직
        const sparkleChars = ["✦", "✧", "₊˚", "♥", "⋆", "💉", "🩹"];
        const sparkleColors = ["#ff99c8", "#ffb5a7", "#b5ead7", "#a0c4ff", "#ffffff"];
        let lastSparkleTime = 0;

        window.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastSparkleTime < 50) return; // 생성 간격 제어
            lastSparkleTime = now;

            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-particle';
            sparkle.innerText = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
            sparkle.style.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
            sparkle.style.left = (e.clientX - 6) + 'px';
            sparkle.style.top = (e.clientY - 6) + 'px';

            const tx = (Math.random() - 0.5) * 40;
            const ty = Math.random() * 30 + 10;
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);

            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 850);
        });

        // 🩸 피 튀김 이펙트 로직
        function triggerBloodSplat(e) {
            const x = e.clientX;
            const y = e.clientY;
            const count = 28;

            for (let i = 0; i < count; i++) {
                const blood = document.createElement('div');
                blood.className = 'blood-particle';
                blood.style.left = x + 'px';
                blood.style.top = y + 'px';

                const size = Math.random() * 8 + 4;
                blood.style.width = size + 'px';
                blood.style.height = size + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 90 + 20;
                const bx = Math.cos(angle) * distance;
                const by = Math.sin(angle) * distance + (Math.random() * 40);

                blood.style.setProperty('--bx', `${bx}px`);
                blood.style.setProperty('--by', `${by}px`);

                document.body.appendChild(blood);

                setTimeout(() => {
                    blood.remove();
                }, 700);
            }
        }

        // 이미지 압축 및 미리보기
        function compressAndPreview(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('image-preview');
            
            if (!file) {
                compressedImageBase64 = "";
                preview.src = "";
                preview.style.display = "none";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const MAX_SIZE = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    preview.src = compressedImageBase64;
                    preview.style.display = "block";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 방명록 등록
        function addPost() {
            const authorInput = document.getElementById('author');
            const contentInput = document.getElementById('content');

            const author = authorInput.value.trim() || "이름 없는 방문자";
            const content = contentInput.value.trim();

            if (!content && !compressedImageBase64) {
                alert("글이나 그림 중 하나는 남겨줘야 해... 🥺");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newPostRef = postsRef.push();
            newPostRef.set({
                id: newPostRef.key,
                author: author,
                content: content,
                image: compressedImageBase64,
                date: dateStr,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                authorInput.value = "";
                contentInput.value = "";
                document.getElementById('imageFile').value = "";
                document.getElementById('image-preview').style.display = "none";
                compressedImageBase64 = "";
            }).catch((error) => {
                console.error(error);
                alert("저장에 실패했어...");
            });
        }

        // 방명록 삭제 (비밀번호 1214)
        function deletePost(id) {
            const password = prompt("비밀번호를 입력해 줘... 💊");
            if (password === null) return;

            if (password !== "1214") {
                alert("비밀번호가 틀렸어... 돌아가!");
                return;
            }

            const confirmDelete = confirm("정말 삭제할 거야...? 🥺 이 흔적은 영영 사라져 버려...");
            if (!confirmDelete) return;

            postsRef.child(id).remove().then(() => {
                alert("흔적이 지워졌어...");
            }).catch((error) => {
                console.error(error);
                alert("삭제에 실패했어...");
            });
        }

        // 실시간 불러오기
        function listenToPosts() {
            const listContainer = document.getElementById('guestbookList');

            postsRef.on('value', (snapshot) => {
                const data = snapshot.val();

                if (!data) {
                    listContainer.innerHTML = `<p style="text-align: center; color: #adb5bd; grid-column: 1 / -1; padding: 20px;">아직 아무도 찾아오지 않았어... 첫 번째 흔적을 남겨줄래? 🥀</p>`;
                    return;
                }

                const posts = Object.values(data).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                let html = "";
                posts.forEach(post => {
                    html += `
                        <div class="gallery-item">
                            <div>
                                <div class="author">💊 ${escapeHtml(post.author)}</div>
                                ${post.image ? `<img src="${post.image}" alt="그림 갤러리">` : ''}
                                ${post.content ? `<div class="content">${escapeHtml(post.content)}</div>` : ''}
                            </div>
                            <div class="card-footer">
                                <div class="date">${post.date}</div>
                                <button class="delete-btn" onclick="deletePost('${post.id}')">삭제 🔪</button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
            });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        window.onload = function() {
            listenToPosts();
        };
    </script>
</body>
</html>
